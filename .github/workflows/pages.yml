name: Publish live menu demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'cmd/demo/**'
      - 'web/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'README*.md'
      - 'docs/RELEASE_NOTES.md'
permissions:
  contents: read
concurrency:
  group: menucraft-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Verify and export isolated sample menus
        run: |
          go test ./...
          go vet ./...
          node --check site/studio.js
          node --test scripts/notebook.test.cjs
          go run ./cmd/demo -output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
