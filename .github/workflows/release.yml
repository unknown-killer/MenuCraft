name: Verify and release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (without v)
        required: true
        default: '1.2.0'
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: menucraft-release
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        name: Resolve release source
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-1.2.0}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF#refs/tags/v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go run . --version
      - if: runner.os == 'Linux'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          php -l wordpress/menucraft/menucraft.php
          node --check web/static/js/menu.js
          node --check web/static/js/menu-editor.js
          node --check wordpress/menucraft/assets/menu.js
          node --test scripts/notebook.test.cjs
          node --check web/static/js/qr.js
  release:
    needs: [source, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Build portable archives and WordPress
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: go run ./cmd/release -version "$VERSION"
      - name: Smoke test packaged Linux binary
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/menucraft-smoke"
          tar -xzf "dist/menucraft_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/menucraft-smoke"
          cd "$RUNNER_TEMP/menucraft-smoke/menucraft_${VERSION}_linux_amd64"
          ./menucraft --version
          MENU_ADDR=127.0.0.1:18090 ./menucraft > smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18090/readyz | grep ready
          curl --fail --silent http://127.0.0.1:18090/register >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: menucraft-${{ needs.source.outputs.version }}
          path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          notes="docs/releases/$VERSION.md"
          if [ ! -f "$notes" ]; then notes=docs/RELEASE_NOTES.md; fi
          gh release create "v$VERSION" dist/* --target "$SOURCE_COMMIT" --title "MenuCraft $VERSION · منوساز" --notes-file "$notes"

